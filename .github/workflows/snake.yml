name: 更新主页贡献动画

on:
  schedule:
    - cron: '23 1 * * *' # 台湾时间每天 09:23
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml

concurrency:
  group: profile-snake-output
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: 生成贡献动画
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#976600&color_dots=#ebedf0,#c4e5eb,#76bdcf,#347f99,#204e68
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#f2c14e&color_dots=#171d28,#243c55,#366481,#5299b8,#8fe3ff
            dist/github-contribution-grid-snake.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9

      - name: 发布到 output 分支
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          commit_message: 'chore(profile): 更新贡献动画'
        env:
          GITHUB_TOKEN: ${{ github.token }}
